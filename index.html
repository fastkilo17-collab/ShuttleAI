<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>
html,body{margin:0;background:transparent;color:#fff;font-family:Arial,'Noto Sans Thai',sans-serif}.score{display:flex;align-items:center;gap:18px;background:rgba(7,25,22,.92);border:2px solid #43d5a0;border-radius:14px;padding:12px 20px;width:max-content;min-width:360px;box-shadow:0 4px 18px #0007}.live{font-size:11px;color:#43d5a0;letter-spacing:2px}.side{display:flex;align-items:center;justify-content:space-between;gap:18px;min-width:125px}.name{font-size:18px;font-weight:700}.pts{font-size:32px;font-weight:900}.sep{height:42px;width:1px;background:#55766c}.status{font-size:11px;color:#f4d27a;margin-top:3px}
</style></head><body><div class="score"><div><div class="live">SHUTTLEAI • LIVE</div><div class="status" id="status">DEMO / NOT AI-VERIFIED</div></div><div class="side"><span class="name" id="a">ฝั่ง A</span><span class="pts" id="pa">0</span></div><div class="sep"></div><div class="side"><span class="name" id="b">ฝั่ง B</span><span class="pts" id="pb">0</span></div></div>
<script>
// Change to wss://YOUR-HOST/ws/scores/MATCH_ID for deployment. Local OBS can use ws://127.0.0.1:8000/ws/scores/demo-match
const WS_URL=new URLSearchParams(location.search).get('ws')||'ws://127.0.0.1:8000/ws/scores/demo-match';
function connect(){const ws=new WebSocket(WS_URL);ws.onmessage=e=>{try{const s=JSON.parse(e.data);document.getElementById('a').textContent=s.side_a||'ฝั่ง A';document.getElementById('b').textContent=s.side_b||'ฝั่ง B';document.getElementById('pa').textContent=s.points_a??0;document.getElementById('pb').textContent=s.points_b??0;document.getElementById('status').textContent=s.ai_status==='not_integrated'?'DEMO / NOT AI-VERIFIED':'LIVE SCORE';}catch(_){}};ws.onclose=()=>setTimeout(connect,2000)}connect();
</script></body></html>
